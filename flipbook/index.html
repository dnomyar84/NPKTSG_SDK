<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Harry Potter and the Philosopher’s Stone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="reader">
  <header class="topbar">
    <div class="brand">
      <strong id="chapterLine">Harry Potter and the Philosopher’s Stone</strong>
      <span id="sceneLine"></span>
    </div>
    <nav class="nav">
      <span class="font-control" role="group" aria-label="Font size">
        <button type="button" class="chrome-btn" id="fontDown" aria-label="Smaller font">−</button>
        <span class="font-label">Font</span>
        <button type="button" class="chrome-btn" id="fontUp" aria-label="Larger font">+</button>
      </span>
      <button type="button" class="chrome-btn" id="fullBtn">Full</button>
      <button type="button" class="ghost" id="notesBtn">Show script notes</button>
    </nav>
  </header>
  <main class="stage" aria-live="polite">
    <div class="book-wrap">
      <div class="book" id="book">
        <article class="page left" id="leftPage"></article>
        <article class="page right" id="rightPage"></article>
        <div class="leaf" id="leaf" hidden>
          <div class="leaf-face leaf-front" id="leafFront"></div>
          <div class="leaf-face leaf-back" id="leafBack"></div>
        </div>
        <div class="mobile-turn" id="mobileTurn" hidden aria-hidden="true"></div>
      </div>
    </div>
  </main>
  <p class="footer-note" id="status"></p>
  <section class="notes" id="notes"></section>
  <script src="story.js"></script>
  <script src="book.js"></script>
</body>
</html>
